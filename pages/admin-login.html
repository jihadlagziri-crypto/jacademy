<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J-Academy — Admin</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    body { min-height:100vh; background:#0A0A0A; display:flex; align-items:center; justify-content:center; padding:24px; }
    .login-card {
      background:#111; border:1px solid #222; border-radius:16px;
      padding:40px 36px; width:100%; max-width:400px;
    }
    .admin-logo { text-align:center; margin-bottom:32px; }
    .admin-logo img { width:70px; height:70px; object-fit:contain; border-radius:10px; margin-bottom:12px; }
    .admin-logo h1 { color:#fff; font-size:1.2rem; font-family:var(--font-head); font-weight:700; letter-spacing:0.06em; }
    .admin-logo p  { color:#444; font-size:0.75rem; letter-spacing:0.12em; text-transform:uppercase; margin-top:4px; }
    .badge-admin {
      display:inline-flex; align-items:center; gap:5px;
      background:rgba(255,255,255,0.06); border:1px solid #2a2a2a;
      color:#666; font-size:0.72rem; padding:4px 12px; border-radius:20px;
      margin-bottom:24px;
    }
    label { display:block; font-size:0.8rem; color:#555; margin-bottom:5px; font-weight:500; }
    .adm-input {
      width:100%; padding:10px 14px; background:#1a1a1a; border:1px solid #2a2a2a;
      border-radius:8px; color:#fff; font-size:0.9rem; outline:none;
      font-family:var(--font-body); margin-bottom:14px; transition:border-color 0.2s;
    }
    .adm-input:focus { border-color:#444; }
    .adm-input::placeholder { color:#333; }
    .btn-adm {
      width:100%; padding:12px; background:#fff; color:#111; border:none;
      border-radius:8px; font-size:0.9rem; font-weight:700; cursor:pointer;
      font-family:var(--font-head); letter-spacing:0.03em; transition:opacity 0.2s;
      display:flex; align-items:center; justify-content:center; gap:8px;
    }
    .btn-adm:hover { opacity:0.9; }
    .err-msg { color:#C0392B; font-size:0.8rem; text-align:center; margin-bottom:12px; display:none; }
    .hint { text-align:center; color:#2a2a2a; font-size:0.75rem; margin-top:20px; }
  </style>
</head>
<body>
<div class="login-card">
  <div class="admin-logo">
    <img src="../logo.png" alt="J-Academy">
    <h1>J-ACADEMY</h1>
    <p>Panneau administrateur</p>
  </div>
  <div style="text-align:center">
    <div class="badge-admin"><i class="ti ti-shield-lock"></i> Accès réservé</div>
  </div>
  <div class="err-msg" id="err">Identifiants incorrects.</div>
  <label>E-mail administrateur</label>
  <input class="adm-input" type="email" id="adm-email" placeholder="admin@jacademy.ma">
  <label>Mot de passe</label>
  <input class="adm-input" type="password" id="adm-pass" placeholder="••••••••">
  <button class="btn-adm" onclick="doLogin()">
    <i class="ti ti-login"></i> Accéder au panneau
  </button>
  <div class="hint">admin@jacademy.ma / admin1234</div>
</div>
<script src="../js/admin.js"></script>
<script src="../js/api.js"></script>
<script>
  if (getAdminSession()) window.location.href = 'admin-dashboard.html';
  function doLogin() {
    var email = document.getElementById('adm-email').value.trim();
    var pass  = document.getElementById('adm-pass').value;
    var result = adminLogin(email, pass);
    if (result && result.then) {
      result.then(function(ok) {
        if (ok) { window.location.href = 'admin-dashboard.html'; }
        else { document.getElementById('err').style.display = 'block'; }
      });
    } else if (result) {
      window.location.href = 'admin-dashboard.html';
    } else {
      document.getElementById('err').style.display = 'block';
    }
  }
  document.addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });
</script>
</body>
</html>
